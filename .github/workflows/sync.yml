name: Sync Todoist to Notion

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: todoist-notion-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run sync
        run: npm run sync
        env:
          TODOIST_API_TOKEN: ${{ secrets.TODOIST_API_TOKEN }}
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
          WORK_DATABASE_ID: ${{ secrets.WORK_DATABASE_ID }}
          PERSONAL_DATABASE_ID: ${{ secrets.PERSONAL_DATABASE_ID }}
          SYNC_STATE_DATABASE_ID: ${{ secrets.SYNC_STATE_DATABASE_ID }}
